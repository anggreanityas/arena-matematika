<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Arena Matematika</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: kertas berpetak sebagai latar; bilah materi di atas; tiap permainan satu layar penuh untuk papan interaktif. */
:root{
  --paper:#F6F8FC; --sheet:#FFFFFF; --grid:#DFE7F3; --grid2:#C9D6EA;
  --ink:#14213D; --muted:#56637C; --line:#D3DCEA;
  --accent:#2B54D8; --accent-ink:#FFFFFF; --hl:#FFD23F; --hl-ink:#14213D;
  --ok:#1A8F52; --ok-bg:#DDF5E8; --bad:#C93A3A; --bad-bg:#FBE3E3;
  --t1:#E2552D; --t2:#12998D; --t3:#7A4BD3; --t4:#D9921B;
  --shadow:0 1px 0 rgba(20,33,61,.06),0 6px 18px -8px rgba(20,33,61,.25); --mk:55%;
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1A2C; --sheet:#14243B; --grid:#18294250; --grid2:#22385A;
  --ink:#ECF1FA; --muted:#9CACC6; --line:#2A3F60;
  --accent:#7EA0FF; --accent-ink:#0B1424; --hl:#FFD23F; --hl-ink:#14213D;
  --ok:#4FD08E; --ok-bg:#163A2A; --bad:#FF7B7B; --bad-bg:#45222A;
  --t1:#FF7A52; --t2:#2CC7B8; --t3:#A584F2; --t4:#F2B444;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px -10px rgba(0,0,0,.6); --mk:80%;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0E1A2C; --sheet:#14243B; --grid:#18294250; --grid2:#22385A;
  --ink:#ECF1FA; --muted:#9CACC6; --line:#2A3F60;
  --accent:#7EA0FF; --accent-ink:#0B1424; --hl:#FFD23F; --hl-ink:#14213D;
  --ok:#4FD08E; --ok-bg:#163A2A; --bad:#FF7B7B; --bad-bg:#45222A;
  --t1:#FF7A52; --t2:#2CC7B8; --t3:#A584F2; --t4:#F2B444;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px -10px rgba(0,0,0,.6); --mk:80%;
  color-scheme:dark }
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
sup{font-size:.68em;line-height:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Bilah atas */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:2px solid var(--ink)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;text-align:left}
.brand-mark{width:38px;height:38px;flex:none}
.brand b{font-family:var(--f-display);font-size:1.45rem;line-height:1;font-weight:800;letter-spacing:-.01em}
.brand small{display:block;font-size:.72rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.picker{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-left:auto}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{border:0;background:none;padding:5px 14px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.picker select{border:2px solid var(--ink);border-radius:10px;background:var(--sheet);padding:6px 10px;font-weight:700;max-width:100%}
.iconbtn{border:2px solid var(--ink);background:var(--sheet);border-radius:10px;padding:6px 10px;font-weight:700;font-size:.9rem;white-space:nowrap}
.iconbtn:hover{background:var(--hl);color:var(--hl-ink)}

/* Beranda */
.home{padding-block:28px 48px}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-items:end;margin-bottom:26px}
.hero h1{font-family:var(--f-display);font-size:clamp(2rem,4.6vw,3.4rem);line-height:1.02;margin:0;font-weight:800;text-wrap:balance}
.hero h1 mark{background:linear-gradient(transparent var(--mk),var(--hl) var(--mk),var(--hl) 92%,transparent 92%);color:inherit;padding:0 .1em}
.hero p{margin:0;color:var(--muted);max-width:52ch}
.games{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.gcard{position:relative;text-align:left;background:var(--sheet);border:2px solid var(--ink);border-radius:16px;padding:18px 18px 16px;
  box-shadow:4px 4px 0 var(--ink);transition:transform .12s ease,box-shadow .12s ease;display:flex;flex-direction:column;gap:8px;min-width:0}
.gcard:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.gcard:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.gcard svg{width:56px;height:56px}
.gcard h2{font-family:var(--f-display);font-size:1.5rem;margin:4px 0 0;line-height:1.1}
.gcard p{margin:0;color:var(--muted);font-size:.95rem}
.gcard .tag{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.note{margin-top:22px;color:var(--muted);font-size:.9rem}

/* Kerangka permainan */
.view{padding-block:18px 40px}
.vhead{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:16px}
.vhead h2{font-family:var(--f-display);font-size:clamp(1.6rem,3.2vw,2.3rem);margin:0;line-height:1.05}
.vhead .sub{color:var(--muted);font-size:.95rem}
.back{border:2px solid var(--ink);background:var(--sheet);border-radius:10px;padding:6px 12px;font-weight:700}
.back:hover{background:var(--hl);color:var(--hl-ink)}
.panel{background:var(--sheet);border:2px solid var(--ink);border-radius:16px;padding:18px;box-shadow:var(--shadow);min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:2px solid var(--ink);border-radius:12px;padding:9px 18px;font-weight:700;background:var(--sheet);font-size:1rem}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.hl{background:var(--hl);color:var(--hl-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:not(:disabled):hover{filter:brightness(1.06);transform:translateY(-1px)}
.label{font-size:.75rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
.big{font-family:var(--f-display);font-weight:800}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* Kartu soal */
.qcard{display:flex;flex-direction:column;gap:14px}
.qmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lv{font-family:var(--f-mono);font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:999px;border:2px solid currentColor}
.lv1{color:var(--ok)} .lv2{color:var(--t4)} .lv3{color:var(--bad)}
.qtext{font-size:clamp(1.25rem,2.4vw,1.75rem);font-weight:700;line-height:1.35;text-wrap:pretty}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:12px 14px;font-size:clamp(1.05rem,1.9vw,1.35rem);min-width:0}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt .k{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;background:var(--ink);color:var(--sheet)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)} .opt.right .k{background:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)} .opt.wrong .k{background:var(--bad)}
.opt.gone{visibility:hidden}
.opt:disabled{cursor:default}
.explain{border-left:5px solid var(--hl);background:var(--paper);padding:10px 14px;border-radius:0 10px 10px 0}
.explain b{font-family:var(--f-display)}

/* Escape room */
.esc{display:grid;grid-template-columns:280px minmax(0,1fr);gap:18px}
.locks{display:flex;flex-direction:column;gap:10px}
.lock{display:flex;gap:12px;align-items:center;padding:10px 12px;border:2px dashed var(--line);border-radius:12px}
.lock.cur{border-style:solid;border-color:var(--ink);background:var(--hl);color:var(--hl-ink)}
.lock.done{border-style:solid;border-color:var(--ok);background:var(--ok-bg)}
.lock .digit{margin-left:auto;font-family:var(--f-mono);font-size:1.3rem;font-weight:700}
.timer{font-family:var(--f-mono);font-size:clamp(2.2rem,5vw,3.4rem);font-weight:700;line-height:1}
.timer.low{color:var(--bad)}
.story{font-style:italic;color:var(--muted)}
.keypad{display:grid;grid-template-columns:repeat(3,64px);gap:8px;justify-content:center}
.keypad button{height:56px;border:2px solid var(--ink);border-radius:12px;background:var(--sheet);font-family:var(--f-display);font-size:1.4rem;font-weight:800}
.codebox{display:flex;gap:8px;justify-content:center}
.codebox span{width:52px;height:64px;border:3px solid var(--ink);border-radius:12px;display:grid;place-items:center;font-family:var(--f-mono);font-size:2rem;font-weight:700;background:var(--paper)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* Battle */
.score2{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch;margin-bottom:16px}
.team{border:3px solid var(--tc);border-radius:16px;padding:12px 16px;background:var(--sheet);display:flex;flex-direction:column;gap:6px;min-width:0}
.team.turn{box-shadow:0 0 0 5px color-mix(in srgb,var(--tc) 35%,transparent)}
.team input{border:0;background:none;font-family:var(--f-display);font-size:1.4rem;font-weight:800;color:var(--tc);width:100%;padding:0}
.team .pts{font-family:var(--f-mono);font-size:clamp(2.4rem,6vw,4rem);font-weight:700;line-height:1}
.pups{display:flex;gap:6px;flex-wrap:wrap}
.pup{border:2px solid var(--tc);color:var(--tc);background:none;border-radius:9px;padding:3px 9px;font-weight:700;font-size:.85rem}
.pup.on{background:var(--tc);color:var(--sheet)}
.pup:disabled{opacity:.35;cursor:default}.pup.used{text-decoration:line-through;opacity:.3}
.vs{display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.6rem;color:var(--muted)}
.board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.tile{aspect-ratio:1.25;border:2px solid var(--ink);border-radius:14px;background:var(--sheet);font-family:var(--f-display);font-weight:800;font-size:clamp(1.3rem,3vw,2.2rem);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;max-width:100%}
.tile small{font-family:var(--f-body);font-size:.7rem;font-weight:700;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.05em}
.tile.l1{box-shadow:inset 0 -6px 0 var(--ok)} .tile.l2{box-shadow:inset 0 -6px 0 var(--t4)} .tile.l3{box-shadow:inset 0 -6px 0 var(--bad)}
.tile:hover:not(:disabled){background:var(--hl);color:var(--hl-ink)}
.tile:disabled{opacity:.25;cursor:default}
.tile.by1{background:color-mix(in srgb,var(--t1) 22%,var(--sheet));opacity:.7} .tile.by2{background:color-mix(in srgb,var(--t2) 22%,var(--sheet));opacity:.7}

/* Roda */
.roda{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
.wheelbox{position:relative;max-width:520px;width:100%;margin:0 auto}
.wheelbox canvas{width:100%;height:auto;display:block}
.pointer{position:absolute;top:50%;right:-6px;transform:translateY(-50%);width:0;height:0;border-top:18px solid transparent;border-bottom:18px solid transparent;border-right:34px solid var(--ink)}
.result{font-family:var(--f-display);font-size:clamp(1.8rem,4vw,2.8rem);font-weight:800;line-height:1.1;min-height:1.2em}
textarea{width:100%;min-height:120px;border:2px solid var(--line);border-radius:12px;background:var(--paper);padding:10px;resize:vertical}
table.sc{width:100%;border-collapse:collapse;font-size:.95rem}
table.sc td{padding:5px 6px;border-bottom:1px solid var(--line)}
table.sc td:last-child{text-align:right;font-family:var(--f-mono);font-weight:700}
.lvpick{display:flex;gap:8px;flex-wrap:wrap}

/* Tebak */
.tebak{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
.plot{width:100%;aspect-ratio:1/1;max-width:100%;border:2px solid var(--ink);border-radius:14px;background:var(--sheet);display:block}
.sliders{display:grid;gap:8px;margin-top:12px}
.sl{display:grid;grid-template-columns:28px minmax(0,1fr) 64px;gap:10px;align-items:center}
.sl b{font-family:var(--f-mono)}
.sl output{font-family:var(--f-mono);text-align:right}
input[type=range]{width:100%;accent-color:var(--accent)}
.formula{font-family:var(--f-mono);font-size:clamp(1.05rem,2vw,1.35rem);font-weight:700;padding:8px 12px;background:var(--paper);border-radius:10px;border:2px solid var(--line);overflow-x:auto}
.steps{display:flex;gap:6px}
.steps span{width:28px;height:8px;border-radius:4px;background:var(--line)}
.steps span.on{background:var(--accent)}
.votes{display:flex;gap:6px;align-items:center}

/* Data */
.dtabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.data{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:18px;align-items:start}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}
.stat{border:2px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--paper)}
.stat .v{font-family:var(--f-mono);font-size:1.6rem;font-weight:700;line-height:1.1}
.qbtns{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.qbtns button{border:2px solid var(--ink);border-radius:10px;background:var(--sheet);padding:10px 0;font-family:var(--f-display);font-weight:800;font-size:1.25rem}
.qbtns button:hover{background:var(--hl);color:var(--hl-ink)}
.chart{width:100%;height:auto;display:block}
input[type=text],input[type=number]{border:2px solid var(--line);border-radius:10px;background:var(--paper);padding:7px 10px;min-width:0}

/* Lomba */
.track{display:flex;flex-direction:column;gap:10px}
.lane{display:grid;grid-template-columns:140px minmax(0,1fr) 54px;gap:10px;align-items:center}
.lane .nm{font-family:var(--f-display);font-weight:800;font-size:1.2rem;color:var(--tc);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.road{position:relative;height:52px;border:2px solid var(--ink);border-radius:12px;background:repeating-linear-gradient(90deg,var(--paper) 0 calc(10% - 2px),var(--line) calc(10% - 2px) 10%);overflow:hidden}
.road .fin{position:absolute;right:0;top:0;bottom:0;width:14px;background:repeating-conic-gradient(var(--ink) 0 25%,var(--sheet) 0 50%) 0 0/14px 14px}
.runner{position:absolute;top:50%;width:40px;height:40px;margin-top:-20px;border-radius:50%;background:var(--tc);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.1rem;transition:left .7s cubic-bezier(.3,1.4,.5,1);border:3px solid var(--sheet);box-shadow:0 0 0 2px var(--tc)}
.lane .pos{font-family:var(--f-mono);font-weight:700;text-align:right}
.lane.turn .nm::before{content:"▶ "}

.banner{border:3px solid var(--ink);border-radius:16px;background:var(--hl);color:var(--hl-ink);padding:18px;text-align:center}
.banner .big{font-size:clamp(1.8rem,4vw,2.8rem)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:10px 18px;border-radius:12px;font-weight:700;z-index:20}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30}

@media (max-width:900px){
  .hero,.esc,.roda,.tebak,.data{grid-template-columns:1fr}
  .games{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (max-width:560px){
  .games{grid-template-columns:1fr}
  .opts{grid-template-columns:1fr}
  .board{grid-template-columns:repeat(3,minmax(0,1fr))}
  .score2{grid-template-columns:1fr 1fr}.vs{display:none}
  .lane{grid-template-columns:80px minmax(0,1fr) 40px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .picker{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <button class="brand" id="homeBtn" type="button" aria-label="Kembali ke beranda">
      <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true"><rect x="2" y="2" width="36" height="36" rx="9" fill="var(--hl)" stroke="var(--ink)" stroke-width="2.5"/><path d="M9 29 Q20 2 31 29" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/><circle cx="20" cy="15.5" r="3" fill="var(--accent)"/></svg>
      <span><b>Arena Matematika</b><small>SMKN 4 Malang · 2026/2027</small></span>
    </button>
    <div class="picker">
      <div class="seg" role="group" aria-label="Kelas">
        <button type="button" id="kX" aria-pressed="false">Kelas X</button>
        <button type="button" id="kXI" aria-pressed="false">Kelas XI</button>
      </div>
      <select id="materiSel" aria-label="Materi"></select>
      <button class="iconbtn" id="soundBtn" type="button">Suara: aktif</button>
      <button class="iconbtn" id="fsBtn" type="button">Layar penuh</button>
    </div>
  </div>
</header>
<main id="app" class="wrap"></main>
<canvas class="confetti" id="confetti" hidden></canvas>
<script>
/* Bank soal. Format: [level 1-3, soal, [jawaban benar, pengecoh, pengecoh, pengecoh], pembahasan]
   ^{...} ditulis jadi pangkat. Disusun dari TP pada modul ajar Matematika X & XI SMKN 4 Malang 2026/2027. */
const BANK = {
  pangkat: { kelas: "X", nama: "Bilangan Berpangkat", explorer: "pangkat", soal: [
    [1, "2^{3} × 2^{4} = …", ["2^{7}", "2^{12}", "4^{7}", "4^{12}"], "Basis sama dikali, pangkat dijumlah: 3 + 4 = 7."],
    [1, "5^{0} = …", ["1", "0", "5", "tak terdefinisi"], "Setiap bilangan bukan nol berpangkat 0 hasilnya 1."],
    [1, "3^{−2} = …", ["1/9", "−9", "−6", "9"], "a^{−n} = 1/a^{n}, jadi 3^{−2} = 1/3^{2} = 1/9."],
    [1, "(a^{3})^{4} = …", ["a^{12}", "a^{7}", "a^{81}", "4a^{3}"], "Pangkat dipangkatkan: pangkatnya dikali, 3 × 4 = 12."],
    [1, "16^{1/2} = …", ["4", "8", "32", "256"], "Pangkat 1/2 berarti akar kuadrat: √16 = 4."],
    [2, "8^{2/3} = …", ["4", "16/3", "6", "2"], "8^{2/3} = (∛8)^{2} = 2^{2} = 4."],
    [2, "Bentuk sederhana dari (2a^{2}b)^{3} adalah …", ["8a^{6}b^{3}", "6a^{6}b^{3}", "8a^{5}b^{3}", "2a^{6}b^{3}"], "Setiap faktor dipangkatkan 3: 2^{3} = 8, (a^{2})^{3} = a^{6}, b^{3}."],

function makeDeck() {
  const used = new Set();
  return { draw(lv) {
    const all = questions().filter(q => !lv || q.lv === lv);
    let pool = all.filter(q => !used.has(q.id));
    if (!pool.length) { all.forEach(q => used.delete(q.id)); pool = all; }
    const q = pool[Math.random() * pool.length | 0]; used.add(q.id); return q;
  } };

let AC;
function beep(type) {
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const seq = { ok: [[660, .08], [880, .14]], bad: [[220, .16], [170, .22]], tick: [[1200, .015]], win: [[523, .1], [659, .1], [784, .1], [1047, .3]], lose: [[392, .2], [330, .2], [262, .4]] }[type];
    let t = AC.currentTime;
    seq.forEach(([f, d]) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type === "bad" || type === "lose" ? "sawtooth" : "triangle"; o.frequency.value = f;
      g.gain.setValueAtTime(type === "tick" ? .05 : .13, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
      o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + .02); t += d;
    });
  } catch (e) {}
}
function toast(msg) {
  const t = h(`<div class="toast" role="status">${msg}</div>`); document.body.append(t);
  setTimeout(() => t.remove(), 1800);
}
function confetti() {
  const cv = $("#confetti"); if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  cv.hidden = false; const W = cv.width = innerWidth, H = cv.height = innerHeight, c = cv.getContext("2d");
  const cols = ["--t1", "--t2", "--t3", "--t4", "--hl", "--accent"].map(css);
  const P = Array.from({ length: 160 }, () => ({ x: W / 2 + (Math.random() - .5) * 200, y: H * .35, vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 4, r: Math.random() * 6 + 4, c: cols[Math.random() * cols.length | 0], a: Math.random() * 6 }));
  let f = 0;
  (function step() {
    c.clearRect(0, 0, W, H);
    P.forEach(p => { p.vy += .35; p.x += p.vx; p.y += p.vy; p.a += .2; c.save(); c.translate(p.x, p.y); c.rotate(p.a); c.fillStyle = p.c; c.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); c.restore(); });
    if (++f < 150) requestAnimationFrame(step); else { c.clearRect(0, 0, W, H); cv.hidden = true; }
  })();
}

/* Kartu soal pilihan ganda. Opsi indeks 0 = benar; urutan diacak. */
function qCard(q, o = {}) {
  const order = shuffle([0, 1, 2, 3]);
  const el = h(`<div class="qcard"><div class="qmeta"><span class="lv lv${q.lv}">${LVN[q.lv]}</span>${o.meta || ""}</div><div class="qtext">${fm(q.q)}</div><div class="opts"></div><div class="explain" hidden></div><div class="row qafter"></div></div>`);
  const box = $(".opts", el); let done = false;
  order.forEach((oi, pos) => {
    const b = h(`<button class="opt" type="button"><span class="k">${"ABCD"[pos]}</span><span>${fm(q.opts[oi])}</span></button>`);
    b.dataset.oi = oi;
    b.onclick = () => {
      if (done) return;
      if (oi === 0) { b.classList.add("right"); beep("ok"); finish(true); }
      else {
        b.classList.add("wrong"); b.disabled = true; beep("bad");
        if (!(o.onWrong && o.onWrong() === true)) finish(false);
      }
    };
    box.append(b);
  });
  function finish(ok) {
    if (done) return; done = true;
    $$(".opt", box).forEach(b => { b.disabled = true; if (b.dataset.oi === "0") b.classList.add("right"); });
    const e = $(".explain", el); e.innerHTML = "<b>Pembahasan.</b> " + fm(q.ex); e.hidden = false;
    o.onAnswer && o.onAnswer(ok);
  }
  el.api = {
    fifty() { shuffle($$(".opt", box).filter(b => b.dataset.oi !== "0" && !b.disabled)).slice(0, 2).forEach(b => { b.classList.add("gone"); b.disabled = true; }); },
    reveal() { finish(false); },
    after(node) { $(".qafter", el).append(node); }
  };
  return el;
}

function grapher(cv, view) {

      for (let y = Math.ceil(y0 / step) * step; y <= y1; y += step) { ctx.beginPath(); ctx.moveTo(0, Y(y)); ctx.lineTo(W, Y(y)); ctx.stroke(); }
      ctx.lineWidth = 3; ctx.strokeStyle = col("--ink");

      ctx.fillStyle = col("--muted"); ctx.font = `500 ${W / 42}px "JetBrains Mono", monospace`; ctx.textAlign = "center"; ctx.textBaseline = "top";
      const lab = view.lab || 2;
      for (let x = Math.ceil(x0 / lab) * lab; x <= x1; x += lab) if (Math.abs(x) > 1e-9 && x > x0 && x < x1) ctx.fillText(x, X(x), Y(0) + 6);
      ctx.textAlign = "right"; ctx.textBaseline = "middle";
      for (let y = Math.ceil(y0 / lab) * lab; y <= y1; y += lab) if (Math.abs(y) > 1e-9 && y > y0 && y < y1) ctx.fillText(y, X(0) - 8, Y(y));
      ctx.font = `700 ${W / 34}px "JetBrains Mono", monospace`; ctx.fillStyle = col("--ink");
      ctx.textAlign = "right"; ctx.textBaseline = "bottom"; ctx.fillText("x", W - 8, Y(0) - 6);
      ctx.textAlign = "left"; ctx.textBaseline = "top"; ctx.fillText("y", X(0) + 10, 6);

    fn(f, color, width = 6, dash) {

    circle(a, b, r, color) { ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 6; ctx.beginPath(); ctx.ellipse(X(a), Y(b), Math.abs(X(r) - X(0)), Math.abs(Y(r) - Y(0)), 0, 0, Math.PI * 2); ctx.stroke(); ctx.restore(); },
    point(x, y, color, label) {

      if (label) { ctx.font = `700 ${W / 30}px "JetBrains Mono", monospace`; ctx.fillStyle = col("--ink"); ctx.textAlign = "left"; ctx.textBaseline = "bottom"; ctx.lineWidth = 6; ctx.strokeText(label, X(x) + 12, Y(y) - 8); ctx.fillText(label, X(x) + 12, Y(y) - 8); }

    const ge = v.filter(x => x >= thr).length;
    const el = h(`<div class="data">
      <div class="panel" style="display:flex;flex-direction:column;gap:12px">
        <div><div class="label">Pertanyaan survei</div><input type="text" id="lab" value="${esc(sv.label)}" style="width:100%;font-weight:700;margin-top:4px"></div>
        <div><div class="label" style="margin-bottom:6px">Ketuk jawaban setiap siswa</div><div class="qbtns" id="qb"></div></div>
        <div class="row"><input type="number" id="other" placeholder="Nilai lain" style="width:120px"><button class="btn" type="button" id="add">Tambah</button></div>
        <div class="row"><button class="btn" type="button" id="undo">Hapus terakhir</button><button class="btn" type="button" id="clr">Kosongkan</button><button class="btn" type="button" id="ex">Isi contoh</button></div>
        <p style="margin:0;color:var(--muted);font-size:.9rem">Data terakhir: <span class="mono">${v.slice(-12).join(", ") || "—"}</span></p>
      </div>
      <div class="panel">
        <div class="row" style="justify-content:space-between"><b class="big" style="font-size:1.35rem">${esc(sv.label)}</b>${sv.sample ? `<span class="lv" style="color:var(--t4)">Data contoh</span>` : ""}</div>
        ${n ? bars(640, 300, cats, cats.map(c => fr[c] || 0), { hl: c => modes.includes(c) && n > 0, xl: "jawaban (kuning = modus)", aria: "Frekuensi jawaban survei" }) : `<p style="padding:40px 0;text-align:center;color:var(--muted)">Belum ada data. Ketuk tombol angka di sebelah kiri untuk setiap jawaban siswa.</p>`}
        <div class="stats">
          <div class="stat"><div class="label">Banyak data</div><div class="v">${n}</div></div>
          <div class="stat"><div class="label">Rata-rata</div><div class="v">${n ? nf(mean) : "—"}</div></div>
          <div class="stat"><div class="label">Median</div><div class="v">${n ? nf(med) : "—"}</div></div>
          <div class="stat"><div class="label">Modus</div><div class="v">${n ? modes.join(", ") : "—"}</div></div>
        </div>
        <div class="explain" style="margin-top:12px"><b>Peluang.</b> Jika satu siswa dipilih acak, peluang jawabannya ≥
          <input type="number" id="thr" value="${thr}" style="width:70px;padding:2px 6px"> adalah <b class="mono">${n ? ge + "/" + n : "—"}</b>${n ? ` ≈ <b class="mono">${nf(ge / n * 100)}%</b>` : ""}.</div>
      </div></div>`);
    const push = x => { if (sv.sample) { sv.vals = []; sv.sample = false; } sv.vals.push(x); save(); beep("tick"); draw(); };
    for (let i = 0; i <= 11; i++) { const b = h(`<button type="button">${i}</button>`); b.onclick = () => push(i); $("#qb", el).append(b); }
    $("#add", el).onclick = () => { const x = parseFloat($("#other", el).value); if (isFinite(x)) push(x); };
    $("#undo", el).onclick = () => { sv.vals.pop(); save(); draw(); };
    $("#clr", el).onclick = () => { sv.vals = []; sv.sample = false; save(); draw(); };
    $("#ex", el).onclick = () => { sv.vals = EX.slice(); sv.sample = true; save(); draw(); };
    $("#lab", el).onchange = e => { sv.label = e.target.value || "Survei kelas"; save(); draw(); };
    $("#thr", el).onchange = e => { thr = +e.target.value; draw(); };
    root.append(el);
  }
  function dadu() {
    const tot = dd.cnt.reduce((a, b) => a + b, 0);
    const el = h(`<div class="data">
      <div class="panel" style="display:flex;flex-direction:column;gap:12px">
        <p style="margin:0">Setiap kelompok melempar dadu sungguhan, lalu ketuk mata dadu yang muncul. Bandingkan hasilnya dengan peluang teoretis 1/6.</p>
        <div class="qbtns" id="db"></div>
        <div class="row"><button class="btn" type="button" id="s100">+100 lemparan simulasi</button><button class="btn" type="button" id="s1000">+1.000 simulasi</button><button class="btn" type="button" id="dclr">Reset</button></div>
        <div class="explain"><b>Pertanyaan diskusi.</b> Apakah hasil 30 lemparan pertama sudah dekat dengan 1/6? Bagaimana setelah 1.000 lemparan?</div>
      </div>
      <div class="panel">
        <div class="row" style="justify-content:space-between"><b class="big" style="font-size:1.35rem">Frekuensi relatif mata dadu</b><span class="mono">${tot} lemparan</span></div>
        ${bars(640, 300, [1, 2, 3, 4, 5, 6], dd.cnt.map(c => tot ? c / tot : 0), { pct: true, ref: 1 / 6, max: .3, aria: "Frekuensi relatif mata dadu" })}
        <div class="stats" style="grid-template-columns:repeat(6,minmax(0,1fr))">${dd.cnt.map((c, i) => `<div class="stat"><div class="label">Mata ${i + 1}</div><div class="v" style="font-size:1.2rem">${c}</div><div class="mono" style="font-size:.8rem;color:var(--muted)">${tot ? nf(c / tot * 100) + "%" : "—"}</div></div>`).join("")}</div>
        <p style="margin:12px 0 0;color:var(--muted)">Frekuensi harapan tiap mata = 1/6 × ${tot} ≈ <b class="mono">${nf(tot / 6)}</b></p>
      </div></div>`);
    for (let i = 1; i <= 6; i++) { const b = h(`<button type="button" aria-label="Mata dadu ${i}">${i}</button>`); b.onclick = () => { dd.cnt[i - 1]++; beep("tick"); draw(); }; $("#db", el).append(b); }
    const sim = k => { for (let i = 0; i < k; i++) dd.cnt[Math.random() * 6 | 0]++; draw(); };
    $("#s100", el).onclick = () => sim(100); $("#s1000", el).onclick = () => sim(1000); $("#dclr", el).onclick = () => { dd.cnt = [0, 0, 0, 0, 0, 0]; draw(); };
    root.append(el);
  }
}

/* ---------- 6. Lomba Lari Soal ---------- */
function gLomba(root) {
  const COLS = ["--t1", "--t2", "--t3", "--t4"];
  let cfg = store.get("lomba", { n: 3, goal: 10, names: ["Tim Merah", "Tim Hijau", "Tim Ungu", "Tim Jingga"] });
  let teams, turn, deck, over;
  setup();
  function setup() {
    root.innerHTML = "";
    const el = h(`<div class="panel" style="max-width:720px;display:flex;flex-direction:column;gap:14px">
      <p style="margin:0">Tim menjawab bergiliran. Jawaban benar membuat pelari maju: soal mudah 1 langkah, sedang 2 langkah, sulit 3 langkah.</p>
      <div><div class="label" style="margin-bottom:6px">Jumlah tim</div><div class="seg" id="nt">${[2, 3, 4].map(k => `<button type="button" data-k="${k}" aria-pressed="${k === cfg.n}">${k} tim</button>`).join("")}</div></div>
      <div><div class="label" style="margin-bottom:6px">Panjang lintasan</div><div class="seg" id="gl">${[8, 10, 15].map(k => `<button type="button" data-k="${k}" aria-pressed="${k === cfg.goal}">${k} langkah</button>`).join("")}</div></div>
      <div id="nm" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px"></div>
      <div class="row"><button class="btn primary" type="button" id="go">Mulai lomba</button></div></div>`);
    $$("#nt button", el).forEach(b => b.onclick = () => { cfg.n = +b.dataset.k; store.set("lomba", cfg); setup(); });
    $$("#gl button", el).forEach(b => b.onclick = () => { cfg.goal = +b.dataset.k; store.set("lomba", cfg); setup(); });
    for (let i = 0; i < cfg.n; i++) { const inp = h(`<input type="text" id="ln${i}" value="${esc(cfg.names[i])}" maxlength="18" style="border-color:var(${COLS[i]});font-weight:700">`); inp.onchange = e => { cfg.names[i] = e.target.value || "Tim " + (i + 1); store.set("lomba", cfg); }; $("#nm", el).append(inp); }
    $("#go", el).onclick = start; root.append(el);
  }
  function start() { teams = cfg.names.slice(0, cfg.n).map((n, i) => ({ n, pos: 0, c: COLS[i] })); turn = 0; deck = makeDeck(); over = false; play(); }
  function trackEl() {
    const t = h(`<div class="panel track"></div>`);
    teams.forEach((tm, i) => t.append(h(`<div class="lane ${i === turn && !over ? "turn" : ""}" style="--tc:var(${tm.c})"><div class="nm">${esc(tm.n)}</div><div class="road"><div class="fin"></div><div class="runner" data-i="${i}" style="left:calc((100% - 58px) * ${Math.min(1, tm.pos / cfg.goal)} + 2px)">${esc(tm.n.replace(/^Tim\s+/i, "").charAt(0).toUpperCase() || i + 1)}</div></div><div class="pos">${tm.pos}/${cfg.goal}</div></div>`)));
    return t;
  }
  function play() {
    root.innerHTML = ""; root.append(trackEl());
    const tm = teams[turn], q = deck.draw();
    const panel = h(`<div class="panel" style="margin-top:16px"></div>`);
    const card = qCard(q, {
      meta: `<span class="label" style="color:var(${tm.c})">Giliran ${esc(tm.n)} · benar = maju ${q.lv} langkah</span>`,
      onAnswer(ok) {
        if (ok) {
          tm.pos = Math.min(cfg.goal, tm.pos + q.lv);
          const old = $(".track", root), nt = trackEl(); old.replaceWith(nt);
          const r = $(`.runner[data-i="${turn}"]`, nt), target = r.style.left; r.style.left = `calc((100% - 58px) * ${Math.min(1, (tm.pos - q.lv) / cfg.goal)} + 2px)`;
          requestAnimationFrame(() => requestAnimationFrame(() => { r.style.left = target; }));
          if (tm.pos >= cfg.goal) { over = true; setTimeout(() => finish(tm), 800); return; }
        }
        const b = h(`<div class="row"><b>${ok ? esc(tm.n) + " maju " + q.lv + " langkah!" : esc(tm.n) + " tetap di tempat."}</b><button class="btn primary" type="button">Giliran ${esc(teams[(turn + 1) % teams.length].n)} →</button></div>`);
        $("button", b).onclick = () => { turn = (turn + 1) % teams.length; play(); };
        card.api.after(b);
      }
    });
    panel.append(card); root.append(panel);
  }
  function finish(tm) {
    beep("win"); confetti();
    root.innerHTML = ""; root.append(trackEl());
    const b = h(`<div class="banner" style="margin-top:16px"><div class="big">${esc(tm.n)} juara!</div><p>Urutan: ${teams.slice().sort((a, b) => b.pos - a.pos).map(t => `${esc(t.n)} (${t.pos})`).join(" · ")}</p><div class="row" style="justify-content:center"><button class="btn primary" type="button" id="ag">Lomba lagi</button><button class="btn" type="button" id="st">Ubah tim</button></div></div>`);
    $("#ag", b).onclick = start; $("#st", b).onclick = setup; root.append(b);
  }
}

/* ---------- Mulai ---------- */
$("#homeBtn").onclick = () => go("home");
$("#kX").onclick = () => { if (BANK[S.materi].kelas !== "X") setMateri("pangkat"); };
$("#kXI").onclick = () => { if (BANK[S.materi].kelas !== "XI") setMateri("komposisi"); };
$("#materiSel").onchange = e => setMateri(e.target.value);
$("#soundBtn").onclick = () => { S.sound = !S.sound; store.set("sound", S.sound); syncPicker(); };
$("#fsBtn").onclick = () => {
  try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => toast("Layar penuh tidak tersedia di tampilan ini")); }
  catch (e) { toast("Layar penuh tidak tersedia di tampilan ini"); }
};
syncPicker();
const startView = (location.hash || "").slice(1);
go(GAMES.some(g => g.id === startView) ? startView : "home");
</script>
